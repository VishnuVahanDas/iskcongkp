{% load static %}
<section id="yatra" class="home-section">
    <div class="container">
        <div class="home-cta row g-4 align-items-center">
            <div class="col-lg-6">
                <p class="home-cta__eyebrow mb-2">Yatra</p>
                <h2 class="home-cta__title mb-3">Plan pilgrimage and travel support in one place</h2>
                <p class="home-cta__lead mb-4">
                    The yatra link stays on the homepage for quick navigation. Open the travel partner when you want to
                    explore pilgrimage planning and route support.
                </p>
                <a class="btn btn-primary" href="http://holytrail.in" target="_blank" rel="noopener noreferrer">
                    Open Holytrail
                </a>
            </div>
            <div class="col-lg-6">
                <div class="home-cta__media">
                    <img src="{% static 'themes/images/nagar_kirtan.jpg' %}" alt="Devotional yatra procession" class="img-fluid rounded-4">
                </div>
            </div>
        </div>
    </div>
</section>
